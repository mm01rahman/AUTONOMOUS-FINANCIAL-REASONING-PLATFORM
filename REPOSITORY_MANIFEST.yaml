schema_version: "1.0"
manifest_id: "REPOSITORY_MANIFEST"
baseline:
  suite_id: "AFRP-BASELINE-1.0.0"
  baseline_tag: "eos-baseline-v1.0"
  genesis_commit_tag: "m1.1-start"
  governance_protocol: "EGP-2.0"
  repository_os: "ROS-1.0.0"
  effective_date: "2026-07-31"
  authority: "Architecture Review Board (ARB) & Engineering OS Core"

products:
  - id: "EOS"
    name: "Engineering Operating System"
    paths: ["tools/afrp-cli/", "03-engineering/", "05-work-packages/"]
  - id: "RUNTIME"
    name: "AFRP Runtime Platform"
    paths: ["06-runtime/"]
  - id: "RESEARCH"
    name: "Research & Strategy Platform"
    paths: ["07-research/"]

topology:
  - path: "00-governance/"
    purpose: "Constitutional rules, KERNEL bootloader, BASELINE_FINGERPRINT.yaml"
  - path: "01-vision/"
    purpose: "Charter and product mission objectives"
  - path: "02-architecture/"
    purpose: "Specifications, SLS docs, ADR ledger, ADR template"
  - path: "03-engineering/"
    purpose: "CAPABILITY_REGISTRY, TRACEABILITY_MATRIX, REPOSITORY_HEALTH"
  - path: "04-ai-framework/"
    purpose: "AI Engineer Playbook, ORCHESTRATOR.md, Role Taxonomy"
  - path: "05-work-packages/"
    purpose: "Task contracts (WP-*.yaml) and evidence ledgers"
  - path: "06-runtime/"
    purpose: "Production runtime source code (Layers 1-6 + common)"
  - path: "07-research/"
    purpose: "Offline notebooks, training scripts, backtest harnesses"
  - path: "08-operations/"
    purpose: "Infrastructure as Code, Dockerfiles, deployment configs"
  - path: "09-validation/"
    purpose: "Test suites, chaos tests, JSON/YAML schemas"
  - path: "10-release/"
    purpose: "Release manifests, tagged deployment baselines"
  - path: "docs/"
    purpose: "Architecture baseline governance assurance and release notes"
  - path: "proto/"
    purpose: "Protobuf v3 wire contracts and custom annotations"
  - path: "tests/"
    purpose: "Global unit and integration test runners"
  - path: "tools/"
    purpose: "Source code for afrp-cli toolchain"

document_index:
  "000_ENGINEERING_CONSTITUTION.md": "00-governance/000_ENGINEERING_CONSTITUTION.md"
  "050_FORMAL_SYSTEM_GLOSSARY.md": "02-architecture/050_FORMAL_SYSTEM_GLOSSARY.md"
  "100_SYSTEM_ARCHITECTURE.md": "02-architecture/100_SYSTEM_ARCHITECTURE.md"
  "110_RUNTIME_ARCHITECTURE.md": "02-architecture/110_RUNTIME_ARCHITECTURE.md"
  "120_ENGINEERING_OPERATING_SYSTEM.md": "03-engineering/120_ENGINEERING_OPERATING_SYSTEM.md"
  "130_MATHEMATICAL_FOUNDATION.md": "02-architecture/130_MATHEMATICAL_FOUNDATION.md"
  "200_REFERENCE_SPECIFICATION.md": "02-architecture/200_REFERENCE_SPECIFICATION.md"
  "300_IMPLEMENTATION_GUIDE.md": "03-engineering/300_IMPLEMENTATION_GUIDE.md"
  "KERNEL.md": "00-governance/KERNEL.md"
  "AFRP_BASELINE_v1.md": "02-architecture/AFRP_BASELINE_v1.md"
  "CAPABILITY_REGISTRY.yaml": "03-engineering/CAPABILITY_REGISTRY.yaml"
  "TRACEABILITY_MATRIX.yaml": "03-engineering/TRACEABILITY_MATRIX.yaml"
  "BUILD_PROFILE.yaml": "03-engineering/BUILD_PROFILE.yaml"
  "BASELINE_FINGERPRINT.yaml": "00-governance/BASELINE_FINGERPRINT.yaml"
  "BASELINE_MANIFEST.md": "docs/governance/BASELINE_MANIFEST.md"
  "BASELINE_FREEZE_POLICY.md": "docs/governance/BASELINE_FREEZE_POLICY.md"
  "ARCHITECTURE_REVIEW_CHECKLIST.md": "docs/governance/ARCHITECTURE_REVIEW_CHECKLIST.md"
  "DEFINITION_OF_DONE.md": "docs/governance/DEFINITION_OF_DONE.md"
  "DOCUMENT_METADATA.yaml": "docs/governance/DOCUMENT_METADATA.yaml"
  "CANONICAL_SOURCE_MAP.yaml": "docs/governance/CANONICAL_SOURCE_MAP.yaml"
  "ARCHITECTURE_BASELINE_FINGERPRINT.yaml": "docs/governance/ARCHITECTURE_BASELINE_FINGERPRINT.yaml"

integrity:
  fingerprint_ledger: "00-governance/BASELINE_FINGERPRINT.yaml"
  hash_algorithm: "sha256"
