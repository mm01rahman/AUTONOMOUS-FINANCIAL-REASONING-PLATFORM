name: AFRP quality gates

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Gate 1: Static analysis ──────────────────────────────────────────────
  lint:
    name: Lint & Format (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.0"
          enable-cache: true
      - run: uv sync --frozen --group dev
      - name: ruff check
        run: uv run ruff check .
      - name: ruff format check (new automation tools)
        run: |
          uv run ruff format --check \
            tools/metrics.py \
            tools/traceability_gate.py \
            tools/evidence_archive.py \
            tools/commit_msg_hook.py

  # ── Gate 2: Type checking ────────────────────────────────────────────────
  typecheck:
    name: Type check (mypy --strict)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.0"
          enable-cache: true
      - run: uv sync --frozen --group dev
      - name: mypy strict
        run: uv run mypy --strict tools 06-runtime 07-research tests

  # ── Gate 3: Tests & Coverage ─────────────────────────────────────────────
  test:
    name: Tests & Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.0"
          enable-cache: true
      - run: uv sync --frozen --group dev
      - name: pytest with coverage
        run: |
          uv run pytest tests \
            --cov \
            --cov-report=term \
            --cov-report=json \
            --cov-report=xml \
            --cov-fail-under=80 \
            -v \
            --tb=short
      - name: Upload coverage JSON
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-report
          path: |
            coverage.json
            coverage.xml
          retention-days: 30

  # ── Gate 4: Protocol validation ───────────────────────────────────────────
  protocol:
    name: Protocol validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.0"
          enable-cache: true
      - run: uv sync --frozen --group dev
      - name: Proto gate (buf-equivalent via grpcio-tools)
        run: uv run python -m tools.proto_gate

  # ── Gate 5: Architecture & fitness ───────────────────────────────────────
  architecture:
    name: Architecture & fitness gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.0"
          enable-cache: true
      - run: uv sync --frozen --group dev
      - name: Baseline gate (FIT-002, FIT-004, FIT-006)
        run: uv run python -m tools.baseline_gate
      - name: Operations gate
        run: uv run python -m tools.ops_gate
      - name: System fitness gate (FIT-008)
        run: |
          AFRP_AUDIT_HMAC_KEY="$(python -c 'import secrets; print(secrets.token_hex(32))')" \
            uv run python -m tools.system_gate

  # ── Gate 6: EOS / AFRP CLI ────────────────────────────────────────────────
  eos:
    name: EOS CLI gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [test]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.0"
          enable-cache: true
      - run: uv sync --frozen --group dev
      - name: Download coverage artifact
        uses: actions/download-artifact@v4
        with:
          name: coverage-report
      - name: afrp boot
        run: uv run afrp boot
      - name: afrp plan
        run: uv run afrp plan
      - name: afrp validate
        run: uv run afrp validate
      - name: afrp health --assert-full
        run: uv run afrp health --assert-full
      - name: Phase D paper trading reports
        run: uv run python -m tools.paper_trading.cli --iterations 24 --output-dir 11-research/phase-d
      - name: Upload Phase D artifacts
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: phase-d-paper-trading
          path: 11-research/phase-d/
          retention-days: 30

  # ── Summary: All gates must pass ─────────────────────────────────────────
  quality:
    name: All quality gates passed
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test, protocol, architecture, eos]
    if: always()
    steps:
      - name: Check all gates
        run: |
          results="${{ join(needs.*.result, ',') }}"
          if echo "$results" | grep -qE '(failure|cancelled)'; then
            echo "❌ One or more quality gates failed: $results"
            exit 1
          fi
          echo "✅ All quality gates passed"
