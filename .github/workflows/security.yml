name: AFRP security automation

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    # Run every Monday at 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── CodeQL static analysis ─────────────────────────────────────────────
  codeql:
    name: CodeQL analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ["python"]
    steps:
      - uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          config-file: .github/codeql/codeql-config.yml

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
          upload: true

  # ── pip-audit: vulnerable dependency detection ─────────────────────────
  pip-audit:
    name: pip-audit (dependency vulnerabilities)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.0"
          enable-cache: true
      - name: Install pip-audit
        run: pip install pip-audit
      - name: Export requirements from uv.lock
        run: uv export --frozen --no-dev --no-emit-project --format requirements-txt > /tmp/requirements.txt
      - name: Audit dependencies
        run: |
          pip-audit \
            -r /tmp/requirements.txt \
            --format json \
            --output pip-audit-report.json \
            --progress-spinner off \
            || (cat pip-audit-report.json && exit 1)
      - name: Upload pip-audit report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pip-audit-report
          path: pip-audit-report.json
          retention-days: 30

  # ── Bandit: Python security linter ────────────────────────────────────
  bandit:
    name: Bandit (SAST)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install bandit
        run: pip install bandit[toml]
      - name: Run bandit
        run: |
          bandit \
            -r tools/afrp-cli/afrp \
            06-runtime/afrp_runtime \
            07-research/afrp_research \
            -f json \
            -o bandit-report.json \
            -ll \
            --exit-zero
          python -c "
          import json, sys
          data = json.load(open('bandit-report.json'))
          highs = [i for i in data.get('results', []) if i.get('issue_severity') == 'HIGH']
          if highs:
              print(f'FAIL: {len(highs)} HIGH severity finding(s)')
              for h in highs:
                  print(f\"  {h['filename']}:{h['line_number']} — {h['issue_text']}\")
              sys.exit(1)
          mediums = [i for i in data.get('results', []) if i.get('issue_severity') == 'MEDIUM']
          print(f'bandit: PASS (0 HIGH, {len(mediums)} MEDIUM)')
          "
      - name: Upload bandit report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bandit-report
          path: bandit-report.json
          retention-days: 30

  # ── Secret scanning notice ─────────────────────────────────────────────
  # GitHub's native secret scanning is enabled via repository settings.
  # This job validates no secrets appear in committed files via trufflehog.
  secret-scan:
    name: Secret scanning (trufflehog)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: TruffleHog OSS
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.before || '' }}
          head: ${{ github.sha }}
          extra_args: --debug --only-verified

  # ── Security gate summary ──────────────────────────────────────────────
  security-gate:
    name: All security gates passed
    runs-on: ubuntu-latest
    needs: [codeql, pip-audit, bandit, secret-scan]
    if: always()
    steps:
      - name: Check all security gates
        run: |
          results="${{ join(needs.*.result, ',') }}"
          if echo "$results" | grep -qE '(failure|cancelled)'; then
            echo "❌ One or more security gates failed: $results"
            exit 1
          fi
          echo "✅ All security gates passed"
