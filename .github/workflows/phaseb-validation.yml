name: Phase B Validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phaseb-vv:
    name: Phase B V&V
    runs-on: ubuntu-latest
    env:
      AFRP_AUDIT_HMAC_KEY: ci-phaseb-key
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --group dev

      - name: Run Phase B validation
        run: uv run python -m tools.phaseb_validation --github-summary

      - name: Upload validation reports
        uses: actions/upload-artifact@v7
        with:
          name: phaseb-validation-reports
          path: 09-validation/reports/
          retention-days: 90
