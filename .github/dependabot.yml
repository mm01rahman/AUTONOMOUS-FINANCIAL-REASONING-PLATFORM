version: 2
updates:
  # ── Python / pip ─────────────────────────────────────────────────────
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    reviewers:
      - "mm01rahman"
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # Ignore major version bumps for core dependencies (review manually)
      - dependency-name: "pydantic"
        update-types: ["version-update:semver-major"]
      - dependency-name: "click"
        update-types: ["version-update:semver-major"]
      - dependency-name: "protobuf"
        update-types: ["version-update:semver-major"]
    groups:
      dev-tools:
        patterns:
          - "ruff"
          - "mypy"
          - "pytest*"
          - "types-*"
      proto:
        patterns:
          - "grpcio*"
          - "protobuf"

  # ── GitHub Actions ────────────────────────────────────────────────────
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    reviewers:
      - "mm01rahman"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(actions)"
