name: Bug report
description: Report a defect in AFRP runtime, CLI, or automation
title: "bug: "
labels: ["bug", "triage"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        **Before filing**: Check the [REPOSITORY_HEALTH.yaml](../../03-engineering/REPOSITORY_HEALTH.yaml)
        and existing issues. All bugs must be reproducible.

  - type: input
    id: capability
    attributes:
      label: Affected capability
      description: Capability ID from CAPABILITY_REGISTRY.yaml (e.g. L1-ING, EOS-VALIDATOR)
      placeholder: "e.g. L3-WRM"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: Clear description of the bug
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Minimal reproduction steps
      placeholder: |
        1. Run `afrp validate`
        2. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should happen
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happens (include stack traces)
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - "P1 — Runtime correctness / data integrity"
        - "P2 — Feature broken with no workaround"
        - "P3 — Feature degraded, workaround exists"
        - "P4 — Minor / cosmetic"
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: AFRP version
      placeholder: "e.g. v2.0.0-layer3"
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Environment, logs, related issues
