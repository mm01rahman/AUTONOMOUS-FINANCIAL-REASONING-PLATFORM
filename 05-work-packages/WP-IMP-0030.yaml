schema_version: "WPS-1.0"
work_package_id: "WP-IMP-0030"
capability_id:
  id: "L6-OPT"
  version: "1.0"
title: "Implement out-of-band Brier calibration and episodic embeddings"
status: "Completed"
is_immutable: true

governance:
  target_subsystem: "SLS-600"
  traceability:
    implements_req: ["FR-014", "NFR-004"]
    trace_sls: "SLS-600"
    trace_adr: ["ADR-0001"]
    trace_vvc: "TVM-001"

preconditions:
  - predicate: "capability.complete('L5-EXE')"
  - predicate: "capability.complete('L1-RDB')"
  - predicate: "capability.complete('L1-MEM')"

resources:
  cpu: "low"
  memory: "512MB"
  network: false
  filesystem:
    write:
      - "06-runtime/afrp_runtime/layer6/learning.py"
      - "tests/unit/test_layer6.py"
      - "05-work-packages/WP-IMP-0030/evidence/"
    read:
      - "06-runtime/afrp_runtime/contracts/"

execution:
  priority: "medium"
  estimated_complexity: "medium"
  estimated_duration: "1h"
  parallelizable: true
  deterministic: true

rollback:
  strategy: "git_checkout_bounded_files"
  restore_tag: "HEAD"

inputs:
  required_files:
    - "06-runtime/afrp_runtime/contracts/cio.py"

outputs:
  expected_source_files:
    - "06-runtime/afrp_runtime/layer6/learning.py"
    - "tests/unit/test_layer6.py"
  expected_evidence:
    - "05-work-packages/WP-IMP-0030/evidence/EXEC-028.yaml"

execution_results:
  source_files_modified:
    - "06-runtime/afrp_runtime/layer6/learning.py"
    - "tests/unit/test_layer6.py"
  evidence_generated:
    - "05-work-packages/WP-IMP-0030/evidence/EXEC-028.yaml"

produces:
  capability:
    id: "L6-OPT"
    version: "1.0"
  unlocks: []

scope:
  bounded_files:
    - "06-runtime/afrp_runtime/layer6/learning.py"
    - "tests/unit/test_layer6.py"
  non_goals:
    - "No online mutation of policy constraints or safety invariants."

requirements:
  calibration:
    module: "06-runtime/afrp_runtime/layer6/learning.py"
    rules:
      - "Rolling multiclass Brier score per agent."
      - "Map score [0,2] to bounded reliability [floor,1] and emit CIO-11."
      - "Deterministic order-invariant hash projection emitting CIO-12."
      - "All learning remains out-of-band; L4-VAL revalidates actions."

quality_gates:
  ruff_lint:
    required: true
    command: "uv run ruff check 06-runtime/ tests/"
  mypy_typecheck:
    required: true
    command: "uv run mypy --strict 06-runtime/ tests/unit/test_layer6.py"
  pytest_units:
    required: true
    command: "uv run pytest tests/unit/test_layer6.py -v"
  fit_004:
    required: true
    command: "uv run afrp validate"

completion:
  success_requires:
    - "Brier numeric oracles and deterministic embedding properties pass."

failure_modes:
  ERR-CALIBRATION: "Forecast distribution malformed."
  ERR-EMBEDDING: "Feature map empty/non-finite or window invalid."

execution_prompt: |
  Execute WP-IMP-0030 strictly within bounded_files.
