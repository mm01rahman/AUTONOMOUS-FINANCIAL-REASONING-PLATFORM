schema_version: "WPS-1.0"
work_package_id: "WP-IMP-0045"
capability_id:
  id: "IKROS-QUERY"
  version: "1.0"
title: "IKROS Foundation — Institutional Query Engine"
status: "Completed"
is_immutable: false

governance:
  target_subsystem: "KNOWLEDGE"
  traceability:
    implements_req: ["NFR-048", "NFR-049", "NFR-050"]
    trace_sls: "AFRP-WP-IMP-0045-1.0.0"
    trace_adr: ["ADR-IKROS-001", "ADR-IKROS-002", "ADR-IKROS-003", "ADR-IKROS-004"]
    trace_vvc: "TVM-001"

preconditions:
  - predicate: "capability.complete('IKROS-MEMORY')"

resources:
  cpu: "low"
  memory: "512MB"
  network: false
  filesystem:
    write:
      - "tools/ikros/query/"
      - "tools/ikros/__init__.py"
      - "tests/unit/test_ikros_query.py"
      - "docs/ikros/"
      - "data/ikros/query/"
      - "05-work-packages/WP-IMP-0045.yaml"
      - "05-work-packages/WP-IMP-0045/"
      - "03-engineering/CAPABILITY_REGISTRY.yaml"
      - "03-engineering/TRACEABILITY_MATRIX.yaml"
    read:
      - "02-architecture/ikros/"
      - "03-engineering/"
      - "specs/07-knowledge/SPEC-060-IKROS-ARCHITECTURE.md"
      - "05-work-packages/WP-IMP-0044.yaml"
      - "05-work-packages/WP-IMP-0044/"

execution:
  priority: "high"
  estimated_complexity: "large"
  estimated_duration: "8h"
  parallelizable: false
  deterministic: true

rollback:
  strategy: "git_checkout_bounded_files"
  restore_tag: "HEAD"

inputs:
  required_files:
    - "02-architecture/ikros/IKROS-QUERY.md"
    - "02-architecture/ikros/IKROS-LINEAGE.md"
    - "02-architecture/ikros/IKROS-CONFIDENCE.md"
    - "03-engineering/CAPABILITY_REGISTRY.yaml"
    - "03-engineering/TRACEABILITY_MATRIX.yaml"
    - "specs/07-knowledge/SPEC-060-IKROS-ARCHITECTURE.md"

outputs:
  expected_source_files:
    - "tools/ikros/__init__.py"
    - "tools/ikros/query/__init__.py"
    - "tools/ikros/query/models.py"
    - "tools/ikros/query/parser.py"
    - "tools/ikros/query/planner.py"
    - "tools/ikros/query/adapters.py"
    - "tools/ikros/query/validation.py"
    - "tools/ikros/query/audit.py"
    - "tools/ikros/query/engine.py"
  expected_test_files:
    - "tests/unit/test_ikros_query.py"
  expected_documentation:
    - "docs/ikros/INSTITUTIONAL_QUERY_GUIDE.md"
  expected_evidence:
    - "05-work-packages/WP-IMP-0045/evidence/EXEC-047.yaml"

execution_results:
  source_files_modified:
    - "tools/ikros/__init__.py"
    - "tools/ikros/query/"
    - "tests/unit/test_ikros_query.py"
    - "docs/ikros/INSTITUTIONAL_QUERY_GUIDE.md"
    - "data/ikros/query/"
    - "03-engineering/CAPABILITY_REGISTRY.yaml"
    - "03-engineering/TRACEABILITY_MATRIX.yaml"
  evidence_generated:
    - "05-work-packages/WP-IMP-0045/evidence/EXEC-047.yaml"

produces:
  capability:
    id: "IKROS-QUERY"
    version: "1.0"
  unlocks: []

scope:
  bounded_files:
    - "tools/ikros/query/"
    - "tools/ikros/__init__.py"
    - "tests/unit/test_ikros_query.py"
    - "docs/ikros/"
    - "data/ikros/query/"
    - "05-work-packages/WP-IMP-0045.yaml"
    - "05-work-packages/WP-IMP-0045/"
    - "03-engineering/CAPABILITY_REGISTRY.yaml"
    - "03-engineering/TRACEABILITY_MATRIX.yaml"
  non_goals:
    - "No natural-language query engine."
    - "No LLM integration."
    - "No vector or semantic search."
    - "No autonomous reasoning or research automation."
    - "No Runtime modification."
    - "No Engineering OS modification."

requirements:
  institutional_query_engine:
    module: "tools/ikros/query/"
    rules:
      - "Implements deterministic query parsing, planning, validation, execution, ranking, and audit logging."
      - "Supports structured queries across registries, the Knowledge Graph, and Institutional Research Memory."
      - "Returns normalized results with lineage, evidence, specification, work package, confidence, temporal, and version metadata."
      - "Enforces governed archive access and entity integrity validation."
      - "Persists query audit records deterministically through a YAML-backed audit log."
      - "Does not import or modify AFRP Runtime."

quality_gates:
  ruff_lint:
    required: true
    command: "uv run ruff check ."
  mypy_typecheck:
    required: true
    command: "uv run mypy --strict tools 06-runtime 07-research tests"
  pytest:
    required: true
    command: "uv run pytest -q --tb=short"
  afrp_validate:
    required: true
    command: "uv run afrp validate"
  afrp_plan:
    required: true
    command: "uv run afrp plan"
  afrp_health:
    required: true
    command: "uv run afrp health"
  afrp_evidence:
    required: true
    command: "uv run afrp evidence --wp WP-IMP-0045"

completion:
  success_requires:
    - "Institutional Query Engine modules implemented under tools/ikros/query/."
    - "Comprehensive query tests pass."
    - "IKROS-QUERY capability added to CAPABILITY_REGISTRY.yaml."
    - "NFR-048, NFR-049, and NFR-050 added to TRACEABILITY_MATRIX.yaml."
    - "All quality gates pass (ruff, mypy --strict, pytest, afrp validate/plan/health/evidence)."
    - "No Runtime behaviour changed."

failure_modes:
  ERR-RUNTIME: "Any modification to Runtime or Engineering OS files is an automatic failure."
  ERR-SCHEMA: "WPS-1.0 schema violation in WP YAML structure."
  ERR-QUERY-INTEGRITY: "Query parsing, execution, ranking, or audit logging is nondeterministic or inconsistent."
  ERR-ARCHIVE-GOVERNANCE: "Archive access bypasses INCLUDE_ARCHIVE or returns invalid memory references."
