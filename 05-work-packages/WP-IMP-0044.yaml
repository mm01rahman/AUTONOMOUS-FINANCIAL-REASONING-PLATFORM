schema_version: "WPS-1.0"
work_package_id: "WP-IMP-0044"
capability_id:
  id: "IKROS-MEMORY"
  version: "1.0"
title: "IKROS Foundation — Institutional Research Memory"
status: "Completed"
is_immutable: false

governance:
  target_subsystem: "KNOWLEDGE"
  traceability:
    implements_req: ["NFR-045", "NFR-046", "NFR-047"]
    trace_sls: "AFRP-WP-IMP-0044-1.0.0"
    trace_adr: ["ADR-IKROS-001", "ADR-IKROS-002", "ADR-IKROS-003", "ADR-IKROS-004"]
    trace_vvc: "TVM-001"

preconditions:
  - predicate: "capability.complete('IKROS-GRAPH')"

resources:
  cpu: "low"
  memory: "512MB"
  network: false
  filesystem:
    write:
      - "tools/ikros/memory/"
      - "tools/ikros/__init__.py"
      - "tests/unit/test_ikros_memory.py"
      - "docs/ikros/"
      - "data/ikros/memory/"
      - "05-work-packages/WP-IMP-0044.yaml"
      - "05-work-packages/WP-IMP-0044/"
      - "03-engineering/CAPABILITY_REGISTRY.yaml"
      - "03-engineering/TRACEABILITY_MATRIX.yaml"
    read:
      - "02-architecture/ikros/"
      - "03-engineering/"
      - "specs/07-knowledge/SPEC-060-IKROS-ARCHITECTURE.md"
      - "05-work-packages/WP-IMP-0043.yaml"
      - "05-work-packages/WP-IMP-0043/"

execution:
  priority: "high"
  estimated_complexity: "large"
  estimated_duration: "8h"
  parallelizable: false
  deterministic: true

rollback:
  strategy: "git_checkout_bounded_files"
  restore_tag: "HEAD"

inputs:
  required_files:
    - "02-architecture/ikros/IKROS-MEMORY.md"
    - "02-architecture/ikros/IKROS-LINEAGE.md"
    - "02-architecture/ikros/IKROS-CONFIDENCE.md"
    - "03-engineering/CAPABILITY_REGISTRY.yaml"
    - "03-engineering/TRACEABILITY_MATRIX.yaml"
    - "specs/07-knowledge/SPEC-060-IKROS-ARCHITECTURE.md"

outputs:
  expected_source_files:
    - "tools/ikros/__init__.py"
    - "tools/ikros/memory/__init__.py"
    - "tools/ikros/memory/models.py"
    - "tools/ikros/memory/core.py"
    - "tools/ikros/memory/retrieval.py"
    - "tools/ikros/memory/validation.py"
    - "tools/ikros/memory/persistence.py"
  expected_test_files:
    - "tests/unit/test_ikros_memory.py"
  expected_documentation:
    - "docs/ikros/RESEARCH_MEMORY_GUIDE.md"
  expected_evidence:
    - "05-work-packages/WP-IMP-0044/evidence/EXEC-046.yaml"

execution_results:
  source_files_modified:
    - "tools/ikros/__init__.py"
    - "tools/ikros/memory/"
    - "tests/unit/test_ikros_memory.py"
    - "docs/ikros/RESEARCH_MEMORY_GUIDE.md"
    - "data/ikros/memory/"
    - "03-engineering/CAPABILITY_REGISTRY.yaml"
    - "03-engineering/TRACEABILITY_MATRIX.yaml"
  evidence_generated:
    - "05-work-packages/WP-IMP-0044/evidence/EXEC-046.yaml"

produces:
  capability:
    id: "IKROS-MEMORY"
    version: "1.0"
  unlocks: []

scope:
  bounded_files:
    - "tools/ikros/memory/"
    - "tools/ikros/__init__.py"
    - "tests/unit/test_ikros_memory.py"
    - "docs/ikros/"
    - "data/ikros/memory/"
    - "05-work-packages/WP-IMP-0044.yaml"
    - "05-work-packages/WP-IMP-0044/"
    - "03-engineering/CAPABILITY_REGISTRY.yaml"
    - "03-engineering/TRACEABILITY_MATRIX.yaml"
  non_goals:
    - "No institutional query engine."
    - "No natural-language search."
    - "No vector database or LLM memory implementation."
    - "No graph reasoning."
    - "No autonomous research implementation."
    - "No Runtime modification."
    - "No Engineering OS modification."

requirements:
  institutional_research_memory:
    module: "tools/ikros/memory/"
    rules:
      - "Implements the approved six memory tiers from working through archive."
      - "Provides deterministic store, retrieve, promote, consolidate, merge, retire, archive, restore, and validate operations."
      - "Preserves lineage, evidence, version history, temporal metadata, and confidence."
      - "Integrates with the Knowledge Graph through governed graph references."
      - "Persists deterministically through a YAML repository adapter behind a repository port."
      - "Does not import or modify AFRP Runtime."

quality_gates:
  ruff_lint:
    required: true
    command: "uv run ruff check ."
  mypy_typecheck:
    required: true
    command: "uv run mypy --strict tools 06-runtime 07-research tests"
  pytest:
    required: true
    command: "uv run pytest -q --tb=short"
  afrp_validate:
    required: true
    command: "uv run afrp validate"
  afrp_plan:
    required: true
    command: "uv run afrp plan"
  afrp_health:
    required: true
    command: "uv run afrp health"
  afrp_evidence:
    required: true
    command: "uv run afrp evidence --wp WP-IMP-0044"

completion:
  success_requires:
    - "Institutional Research Memory modules implemented under tools/ikros/memory/."
    - "Comprehensive memory tests pass."
    - "IKROS-MEMORY capability added to CAPABILITY_REGISTRY.yaml."
    - "NFR-045, NFR-046, and NFR-047 added to TRACEABILITY_MATRIX.yaml."
    - "All quality gates pass (ruff, mypy --strict, pytest, afrp validate/plan/health/evidence)."
    - "No Runtime behaviour changed."

failure_modes:
  ERR-RUNTIME: "Any modification to Runtime or Engineering OS files is an automatic failure."
  ERR-SCHEMA: "WPS-1.0 schema violation in WP YAML structure."
  ERR-MEMORY-INTEGRITY: "Memory allows broken lineage, invalid archive state, or inconsistent confidence."
  ERR-DETERMINISM: "Memory persistence, merge behavior, or retrieval ordering is nondeterministic."
