schema_version: "WPS-1.0"
work_package_id: "WP-IMP-0047"
capability_id:
  id: "IKROS-CONFIDENCE"
  version: "1.0"
title: "IKROS Foundation — Institutional Research Confidence & Evidence Engine"
status: "Completed"
is_immutable: false

governance:
  target_subsystem: "KNOWLEDGE"
  traceability:
    implements_req: ["NFR-054", "NFR-055", "NFR-056"]
    trace_sls: "AFRP-WP-IMP-0047-1.0.0"
    trace_adr: ["ADR-IKROS-001", "ADR-IKROS-002", "ADR-IKROS-003", "ADR-IKROS-004", "ADR-IKROS-005"]
    trace_vvc: "TVM-001"

preconditions:
  - predicate: "capability.complete('IKROS-INGESTION')"

resources:
  cpu: "low"
  memory: "512MB"
  network: false
  filesystem:
    write:
      - "tools/ikros/confidence/"
      - "tools/ikros/__init__.py"
      - "tests/unit/test_ikros_confidence.py"
      - "docs/ikros/RESEARCH_CONFIDENCE_ENGINE_GUIDE.md"
      - "data/ikros/confidence/"
      - "05-work-packages/WP-IMP-0047.yaml"
      - "05-work-packages/WP-IMP-0047/"
      - "03-engineering/CAPABILITY_REGISTRY.yaml"
      - "03-engineering/TRACEABILITY_MATRIX.yaml"
    read:
      - "02-architecture/ikros/"
      - "03-engineering/"
      - "specs/07-knowledge/SPEC-060-IKROS-ARCHITECTURE.md"
      - "05-work-packages/WP-IMP-0046.yaml"
      - "05-work-packages/WP-IMP-0046/"

execution:
  priority: "high"
  estimated_complexity: "large"
  estimated_duration: "8h"
  parallelizable: false
  deterministic: true

rollback:
  strategy: "git_checkout_bounded_files"
  restore_tag: "HEAD"

inputs:
  required_files:
    - "02-architecture/ikros/IKROS-CONFIDENCE.md"
    - "02-architecture/ikros/IKROS-INTEGRATION.md"
    - "02-architecture/ikros/IKROS-GOVERNANCE.md"
    - "02-architecture/ikros/IKROS-KNOWLEDGE-GRAPH.md"
    - "02-architecture/ikros/IKROS-MEMORY.md"
    - "02-architecture/ikros/IKROS-QUERY.md"
    - "03-engineering/CAPABILITY_REGISTRY.yaml"
    - "03-engineering/TRACEABILITY_MATRIX.yaml"
    - "specs/07-knowledge/SPEC-060-IKROS-ARCHITECTURE.md"

outputs:
  expected_source_files:
    - "tools/ikros/__init__.py"
    - "tools/ikros/confidence/__init__.py"
    - "tools/ikros/confidence/models.py"
    - "tools/ikros/confidence/persistence.py"
    - "tools/ikros/confidence/validation.py"
    - "tools/ikros/confidence/engine.py"
  expected_test_files:
    - "tests/unit/test_ikros_confidence.py"
  expected_documentation:
    - "docs/ikros/RESEARCH_CONFIDENCE_ENGINE_GUIDE.md"
  expected_evidence:
    - "05-work-packages/WP-IMP-0047/evidence/EXEC-049.yaml"

execution_results:
  source_files_modified:
    - "tools/ikros/__init__.py"
    - "tools/ikros/confidence/"
    - "tests/unit/test_ikros_confidence.py"
    - "docs/ikros/RESEARCH_CONFIDENCE_ENGINE_GUIDE.md"
    - "data/ikros/confidence/"
    - "03-engineering/CAPABILITY_REGISTRY.yaml"
    - "03-engineering/TRACEABILITY_MATRIX.yaml"
  evidence_generated:
    - "05-work-packages/WP-IMP-0047/evidence/EXEC-049.yaml"

produces:
  capability:
    id: "IKROS-CONFIDENCE"
    version: "1.0"
  unlocks: []

scope:
  bounded_files:
    - "tools/ikros/confidence/"
    - "tools/ikros/__init__.py"
    - "tests/unit/test_ikros_confidence.py"
    - "docs/ikros/RESEARCH_CONFIDENCE_ENGINE_GUIDE.md"
    - "data/ikros/confidence/"
    - "05-work-packages/WP-IMP-0047.yaml"
    - "05-work-packages/WP-IMP-0047/"
    - "03-engineering/CAPABILITY_REGISTRY.yaml"
    - "03-engineering/TRACEABILITY_MATRIX.yaml"
  non_goals:
    - "No LLMs."
    - "No semantic search or embeddings."
    - "No autonomous research or hypothesis generation."
    - "No alpha discovery."
    - "No Runtime modification."
    - "No Engineering OS modification."

requirements:
  institutional_research_confidence_engine:
    module: "tools/ikros/confidence/"
    rules:
      - "Implements deterministic evidence aggregation into independent confidence dimensions and overall confidence."
      - "Tracks replication, contradiction severity, research quality indicators, confidence history, and audit logs."
      - "Propagates confidence through the Knowledge Graph while preserving registry, graph, memory, and query integration."
      - "Persists assessments, history, and audit records using deterministic YAML serialization."
      - "Does not import or modify AFRP Runtime."

quality_gates:
  ruff_lint:
    required: true
    command: "uv run ruff check ."
  mypy_typecheck:
    required: true
    command: "uv run mypy --strict tools 06-runtime 07-research tests"
  pytest:
    required: true
    command: "uv run pytest -q --tb=short"
  afrp_validate:
    required: true
    command: "uv run afrp validate"
  afrp_plan:
    required: true
    command: "uv run afrp plan"
  afrp_health:
    required: true
    command: "uv run afrp health"
  afrp_evidence:
    required: true
    command: "uv run afrp evidence --wp WP-IMP-0047"

completion:
  success_requires:
    - "Institutional Research Confidence & Evidence Engine modules implemented under tools/ikros/confidence/."
    - "Confidence scoring, propagation, contradiction, replication, and audit tests pass."
    - "IKROS-CONFIDENCE capability added to CAPABILITY_REGISTRY.yaml."
    - "NFR-054, NFR-055, and NFR-056 added to TRACEABILITY_MATRIX.yaml."
    - "All quality gates pass (ruff, mypy --strict, pytest, afrp validate/plan/health/evidence)."
    - "No Runtime behaviour changed."

failure_modes:
  ERR-RUNTIME: "Any modification to Runtime or Engineering OS files is an automatic failure."
  ERR-SCHEMA: "WPS-1.0 schema violation in WP YAML structure."
  ERR-CONFIDENCE-DETERMINISM: "Confidence assessment, propagation, history, or audit output is nondeterministic."
  ERR-TRACEABILITY: "Confidence updates are missing structured evidence references, review metadata, or audit coverage."
