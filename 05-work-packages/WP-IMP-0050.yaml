schema_version: "WPS-1.0"
work_package_id: "WP-IMP-0050"
capability_id:
  id: "ALPHA-RESEARCH"
  version: "1.0"
title: "Generation 2 — Institutional Alpha Evidence & Validation Engine"
status: "Completed"
is_immutable: false

governance:
  target_subsystem: "RESEARCH"
  traceability:
    implements_req: ["NFR-029", "NFR-030", "NFR-031", "NFR-032"]
    trace_sls: "AFRP-GEN2-WP0050-1.0.0"
    trace_adr: ["ADR-0001", "ADR-IKROS-001", "ADR-IKROS-005"]
    trace_vvc: "TVM-001"

preconditions:
  - predicate: "capability.complete('ALPHA-RESEARCH')"

resources:
  cpu: "medium"
  memory: "2GB"
  network: false
  filesystem:
    write:
      - "tools/alpha_research/institutional_alpha_evidence_validation_engine.py"
      - "tools/alpha_research/wp_imp_0050_evidence_validation_engine.py"
      - "tests/unit/test_wp_imp_0050_evidence_validation_engine.py"
      - "11-research/generation-2/wp-imp-0050-institutional-alpha-evidence-validation-engine/"
      - "schemas/institutional-alpha-evidence/"
      - "data/ikros/graph/"
      - "data/ikros/registries/research/"
      - "data/ikros/registries/experiments/"
      - "05-work-packages/WP-IMP-0050.yaml"
    read:
      - "11-research/discovery-cycle-3/phase-4-adaptive-alpha-validation/"
      - "11-research/discovery-cycle-3/phase-5-institutional-alpha-revision/"
      - "data/ikros/"
      - "03-engineering/CAPABILITY_REGISTRY.yaml"
      - "03-engineering/TRACEABILITY_MATRIX.yaml"

execution:
  priority: "high"
  estimated_complexity: "large"
  estimated_duration: "8h"
  parallelizable: false
  deterministic: true

rollback:
  strategy: "git_checkout_bounded_files"
  restore_tag: "HEAD"

inputs:
  required_files:
    - "11-research/discovery-cycle-3/phase-4-adaptive-alpha-validation/dc3_phase4_batch1_validation.json"
    - "11-research/discovery-cycle-3/phase-5-institutional-alpha-revision/dc3_phase5_revision_analysis.json"
    - "data/ikros/"
    - "03-engineering/CAPABILITY_REGISTRY.yaml"
    - "03-engineering/TRACEABILITY_MATRIX.yaml"
    - "specs/07-knowledge/SPEC-060-IKROS-ARCHITECTURE.md"

outputs:
  expected_source_files:
    - "tools/alpha_research/institutional_alpha_evidence_validation_engine.py"
    - "tools/alpha_research/wp_imp_0050_evidence_validation_engine.py"
  expected_test_files:
    - "tests/unit/test_wp_imp_0050_evidence_validation_engine.py"
  expected_documentation:
    - "11-research/generation-2/wp-imp-0050-institutional-alpha-evidence-validation-engine/"
  expected_evidence:
    - "11-research/generation-2/wp-imp-0050-institutional-alpha-evidence-validation-engine/wp_imp_0050_evidence_validation_engine.json"

produces:
  capability:
    id: "ALPHA-RESEARCH"
    version: "1.0"
  unlocks: []

scope:
  bounded_files:
    - "tools/alpha_research/institutional_alpha_evidence_validation_engine.py"
    - "tools/alpha_research/wp_imp_0050_evidence_validation_engine.py"
    - "tests/unit/test_wp_imp_0050_evidence_validation_engine.py"
    - "11-research/generation-2/wp-imp-0050-institutional-alpha-evidence-validation-engine/"
    - "schemas/institutional-alpha-evidence/"
    - "data/ikros/graph/"
    - "data/ikros/registries/research/"
    - "data/ikros/registries/experiments/"
    - "05-work-packages/WP-IMP-0050.yaml"
  non_goals:
    - "No Runtime modifications."
    - "No broker integration."
    - "No alpha promotion."
    - "No optimization or parameter tuning."

requirements:
  evidence_validation_engine:
    module: "tools/alpha_research/institutional_alpha_evidence_validation_engine.py"
    rules:
      - "Implements deterministic evidence-first validation stages with hard observation completeness stop."
      - "Maintains evidence ledger, scorecards, failure dossiers, confidence updates, lineage, and promotion-state transitions."
      - "Classifies failures using governed institutional taxonomy and emits remediation guidance."
      - "Generates machine-readable artifacts, markdown reports, and JSON schemas."
      - "Integrates with IKROS graph and registries through governed runner without Runtime changes."

quality_gates:
  ruff_lint:
    required: true
    command: "uv run ruff check ."
  mypy_typecheck:
    required: true
    command: "uv run mypy --strict tools 06-runtime 07-research tests"
  pytest:
    required: true
    command: "uv run pytest -q --tb=short"
  afrp_validate:
    required: true
    command: "uv run afrp validate"
  afrp_plan:
    required: true
    command: "uv run afrp plan"
  afrp_health:
    required: true
    command: "uv run afrp health"
  afrp_evidence:
    required: true
    command: "uv run afrp evidence --wp WP-IMP-0050"

completion:
  success_requires:
    - "Permanent institutional evidence engine implemented with deterministic validation policy."
    - "Evidence ledger, scorecards, mechanism dossiers, failure dossiers, and confidence reports generated."
    - "IKROS graph payload and governed lineage updates emitted."
    - "No mechanism promoted to Institutional Alpha."
    - "No Runtime behavior changed."

failure_modes:
  ERR-RUNTIME: "Any modification to Runtime or Engineering OS files is an automatic failure."
  ERR-SCHEMA: "WPS-1.0 schema violation in WP YAML structure."
  ERR-NONDETERMINISTIC: "Validation outputs are nondeterministic across runs."
  ERR-GOVERNANCE: "Validation executes promotion or bypasses observation completeness gate."
