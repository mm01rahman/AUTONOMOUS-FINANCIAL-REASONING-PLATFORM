schema_version: "WPS-1.0"
work_package_id: "WP-IMP-0029"
capability_id:
  id: "L5-EXE"
  version: "1.0"
title: "Implement Layer 5 execution gateway, audit, fills, and reconciliation"
status: "Completed"
is_immutable: true

governance:
  target_subsystem: "SLS-500"
  traceability:
    implements_req: ["FR-013", "NFR-005", "NFR-007"]
    trace_sls: "SLS-500"
    trace_adr: ["ADR-0001"]
    trace_vvc: "TVM-001"

preconditions:
  - predicate: "capability.complete('L4-VAL')"
  - predicate: "capability.complete('L1-RDB')"

resources:
  cpu: "low"
  memory: "512MB"
  network: false
  filesystem:
    write:
      - "06-runtime/afrp_runtime/layer5/execution.py"
      - "tests/unit/test_layer5.py"
      - "05-work-packages/WP-IMP-0029/evidence/"
    read:
      - "06-runtime/afrp_runtime/contracts/"

execution:
  priority: "critical"
  estimated_complexity: "medium"
  estimated_duration: "2h"
  parallelizable: false
  deterministic: true

rollback:
  strategy: "git_checkout_bounded_files"
  restore_tag: "HEAD"

inputs:
  required_files:
    - "06-runtime/afrp_runtime/contracts/cio.py"

outputs:
  expected_source_files:
    - "06-runtime/afrp_runtime/layer5/execution.py"
    - "tests/unit/test_layer5.py"
  expected_evidence:
    - "05-work-packages/WP-IMP-0029/evidence/EXEC-027.yaml"

execution_results:
  source_files_modified:
    - "06-runtime/afrp_runtime/layer5/execution.py"
    - "tests/unit/test_layer5.py"
  evidence_generated:
    - "05-work-packages/WP-IMP-0029/evidence/EXEC-027.yaml"

produces:
  capability:
    id: "L5-EXE"
    version: "1.0"
  unlocks:
    - {id: "L6-OPT", version: "1.0"}
    - {id: "RESEARCH-HARNESS", version: "1.0"}
    - {id: "SYSTEM-VALIDATION", version: "1.0"}

scope:
  bounded_files:
    - "06-runtime/afrp_runtime/layer5/execution.py"
    - "tests/unit/test_layer5.py"
  non_goals:
    - "No venue network adapter or broker-specific protocol."

requirements:
  execution:
    module: "06-runtime/afrp_runtime/layer5/execution.py"
    rules:
      - "Exhaustive CIO-08 order FSM with terminal dead ends."
      - "Quantity-conserving CIO-09 partial/final fill handling."
      - "Synchronous abstract event-store port for RPO = 0."
      - "HMAC-authenticated trace-bearing audit entry on every state change."
      - "CIO-10 cash, cost-basis, exposure, and equity reconciliation."
      - "Checkpoint restore completes within the RTO < 60s bound."

quality_gates:
  ruff_lint:
    required: true
    command: "uv run ruff check 06-runtime/ tests/"
  mypy_typecheck:
    required: true
    command: "uv run mypy --strict 06-runtime/ tests/unit/test_layer5.py"
  pytest_units:
    required: true
    command: "uv run pytest tests/unit/test_layer5.py -v"
  fit_004:
    required: true
    command: "uv run afrp validate"

completion:
  success_requires:
    - "All legal/illegal transitions, fills, audit tamper, and recovery paths pass."

failure_modes:
  ERR-ORDER-STATE: "Illegal state transition."
  ERR-OVERFILL: "Cumulative fills exceed authorization."
  ERR-AUDIT-KEY: "Environment HMAC key unavailable."

execution_prompt: |
  Execute WP-IMP-0029 strictly within bounded_files.
