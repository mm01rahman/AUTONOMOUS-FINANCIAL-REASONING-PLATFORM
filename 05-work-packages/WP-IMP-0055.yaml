schema_version: "WPS-1.0"
work_package_id: "WP-IMP-0055"
capability_id:
  id: "ALPHA-PORTFOLIO-INTELLIGENCE"
  version: "1.0"
title: "Program 5 — Institutional Alpha Portfolio Intelligence System"
status: "Completed"
is_immutable: false

governance:
  target_subsystem: "RESEARCH"
  traceability:
    implements_req: ["NFR-029", "NFR-030", "NFR-031", "NFR-032"]
    trace_sls: "AFRP-GEN2-WP0055-1.0.0"
    trace_adr: ["ADR-0001", "ADR-IKROS-001", "ADR-IKROS-005"]
    trace_vvc: "TVM-001"

preconditions:
  - predicate: "work_package.completed('WP-IMP-0054')"

resources:
  cpu: "medium"
  memory: "2GB"
  network: false
  filesystem:
    write:
      - "tools/alpha_research/institutional_alpha_portfolio_intelligence.py"
      - "tools/alpha_research/program5_institutional_alpha_portfolio_intelligence.py"
      - "tests/unit/test_program5_institutional_alpha_portfolio_intelligence.py"
      - "11-research/program-5-institutional-alpha-portfolio-intelligence-system/"
      - "schemas/institutional-alpha-portfolio/"
      - "data/ikros/graph/"
      - "data/ikros/orchestrator/audit/"
      - "data/ikros/orchestrator/campaigns/"
      - "data/ikros/orchestrator/reports/"
      - "data/ikros/memory/t1-episodic/"
      - "data/ikros/memory/t4-institutional/"
      - "data/ikros/registries/research/"
      - "data/ikros/registries/experiments/"
      - "05-work-packages/WP-IMP-0055.yaml"
    read:
      - "11-research/program-4-institutional-alpha-expansion-program/"
      - "11-research/program-3-autonomous-institutional-alpha-campaign-engine/"
      - "11-research/program-2-institutional-alpha-research-laboratory/"
      - "data/ikros/"
      - "03-engineering/CAPABILITY_REGISTRY.yaml"
      - "03-engineering/TRACEABILITY_MATRIX.yaml"

execution:
  priority: "high"
  estimated_complexity: "large"
  estimated_duration: "20h"
  parallelizable: false
  deterministic: true

rollback:
  strategy: "git_checkout_bounded_files"
  restore_tag: "HEAD"

inputs:
  required_files:
    - "11-research/program-4-institutional-alpha-expansion-program/approved_alpha_registry.json"
    - "11-research/program-4-institutional-alpha-expansion-program/mechanism_independence_matrix.json"
    - "11-research/program-4-institutional-alpha-expansion-program/correlation_matrix.json"
    - "11-research/program-2-institutional-alpha-research-laboratory/research_director.json"
    - "data/ikros/"
    - "03-engineering/CAPABILITY_REGISTRY.yaml"
    - "03-engineering/TRACEABILITY_MATRIX.yaml"

outputs:
  expected_source_files:
    - "tools/alpha_research/institutional_alpha_portfolio_intelligence.py"
    - "tools/alpha_research/program5_institutional_alpha_portfolio_intelligence.py"
  expected_test_files:
    - "tests/unit/test_program5_institutional_alpha_portfolio_intelligence.py"
  expected_documentation:
    - "11-research/program-5-institutional-alpha-portfolio-intelligence-system/"
  expected_evidence:
    - "11-research/program-5-institutional-alpha-portfolio-intelligence-system/portfolio_registry.json"
    - "11-research/program-5-institutional-alpha-portfolio-intelligence-system/allocation_registry.json"
    - "11-research/program-5-institutional-alpha-portfolio-intelligence-system/FINAL_REPORT.md"
    - "schemas/institutional-alpha-portfolio/"

produces:
  capability:
    id: "ALPHA-PORTFOLIO-INTELLIGENCE"
    version: "1.0"
  unlocks: []

scope:
  bounded_files:
    - "tools/alpha_research/institutional_alpha_portfolio_intelligence.py"
    - "tools/alpha_research/program5_institutional_alpha_portfolio_intelligence.py"
    - "tests/unit/test_program5_institutional_alpha_portfolio_intelligence.py"
    - "11-research/program-5-institutional-alpha-portfolio-intelligence-system/"
    - "schemas/institutional-alpha-portfolio/"
    - "data/ikros/graph/"
    - "data/ikros/orchestrator/audit/"
    - "data/ikros/orchestrator/campaigns/"
    - "data/ikros/orchestrator/reports/"
    - "data/ikros/memory/t1-episodic/"
    - "data/ikros/memory/t4-institutional/"
    - "data/ikros/registries/research/"
    - "data/ikros/registries/experiments/"
    - "05-work-packages/WP-IMP-0055.yaml"
  non_goals:
    - "No Runtime redesign."
    - "No broker integration."
    - "No order management."
    - "No paper trading."
    - "No live execution."

requirements:
  portfolio_engine:
    module: "tools/alpha_research/institutional_alpha_portfolio_intelligence.py"
    rules:
      - "Construct the institutional portfolio from the approved alpha library only."
      - "Generate independence, evidence-independence, correlation, allocation, conflict, risk, capacity, regime, lifecycle, explainability, and dashboard artifacts."
      - "All allocation and decision outputs must be deterministic and scientifically explainable."
      - "Portfolio intelligence must remain governance-only and must not execute trades."

quality_gates:
  ruff_lint:
    required: true
    command: "uv run ruff check ."
  mypy_typecheck:
    required: true
    command: "uv run mypy --strict tools 06-runtime 07-research tests"
  pytest:
    required: true
    command: "uv run pytest -q --tb=short"
  afrp_validate:
    required: true
    command: "uv run afrp validate"
  afrp_plan:
    required: true
    command: "uv run afrp plan"
  afrp_health:
    required: true
    command: "uv run afrp health"
  afrp_evidence:
    required: true
    command: "uv run afrp evidence --wp WP-IMP-0055"

completion:
  success_requires:
    - "AFRP can construct a governed institutional portfolio from the approved alpha library."
    - "Every allocation and portfolio decision is reproducible and scientifically explainable."
    - "IKROS portfolio registry, lineage, graph, memory, and audit artifacts are emitted through the governed runner."
    - "Portfolio schemas, reports, dashboards, and tests are generated and versioned."

failure_modes:
  ERR-RUNTIME: "Any modification to Runtime or Engineering OS files is an automatic failure."
  ERR-NONDETERMINISTIC: "Portfolio allocations or decisions differ across repeated executions."
  ERR-OPAQUE: "Portfolio decisions are emitted without explanation, attribution, or conflict resolution."
  ERR-EXECUTION: "Any portfolio surface attempts to place orders, simulate execution, or connect to brokers."
