schema_version: "WPS-1.0"
work_package_id: "WP-IMP-0016"
capability_id:
  id: "L1-MEM"
  version: "1.0"
title: "Implement L1 vector memory"
status: "Completed"
is_immutable: true

governance:
  target_subsystem: "SLS-100"
  traceability:
    implements_req: ["FR-009"]
    trace_sls: "SLS-100"
    trace_adr: ["ADR-0001"]
    trace_vvc: "TVM-001"

preconditions:
  - predicate: "capability.complete('L1-FST')"

resources:
  cpu: "low"
  memory: "512MB"
  network: false
  filesystem:
    write:
      - "06-runtime/afrp_runtime/layer1/memory.py"
      - "tests/unit/test_layer1.py"
      - "05-work-packages/WP-IMP-0016/evidence/"
    read:
      - "06-runtime/afrp_runtime/contracts/"

execution:
  priority: "high"
  estimated_complexity: "small"
  estimated_duration: "1h"
  parallelizable: true
  deterministic: true

rollback:
  strategy: "git_checkout_bounded_files"
  restore_tag: "HEAD"

inputs:
  required_files:
    - "06-runtime/afrp_runtime/contracts/cio.py"

outputs:
  expected_source_files:
    - "06-runtime/afrp_runtime/layer1/memory.py"
  expected_evidence:
    - "05-work-packages/WP-IMP-0016/evidence/EXEC-014.yaml"

execution_results:
  source_files_modified:
    - "06-runtime/afrp_runtime/layer1/memory.py"
    - "tests/unit/test_layer1.py"
  evidence_generated:
    - "05-work-packages/WP-IMP-0016/evidence/EXEC-014.yaml"

produces:
  capability:
    id: "L1-MEM"
    version: "1.0"
  unlocks:
    - id: "L6-OPT"
      version: "1.0"

scope:
  bounded_files:
    - "06-runtime/afrp_runtime/layer1/memory.py"
    - "tests/unit/test_layer1.py"
  non_goals:
    - "No belief formation (Layer 2)."

requirements:
  implementation:
    module: "06-runtime/afrp_runtime/layer1/memory.py"
    rules:
      - "Fixed-dimension store; cosine top-k with deterministic tie-break."
      - "Dimension mismatches rejected as contract violations."

quality_gates:
  ruff_lint:
    required: true
    command: "uv run ruff check 06-runtime/ tests/"
  mypy_typecheck:
    required: true
    command: "uv run mypy --strict 06-runtime/ tests/unit/test_layer1.py"
  pytest_units:
    required: true
    command: "uv run pytest tests/unit/test_layer1.py -v"

completion:
  success_requires:
    - "Contract-only interconnect; gates pass with zero errors."

failure_modes:
  ERR-CONTRACT-VIOLATION: "Malformed telemetry or payload rejected."

execution_prompt: |
  Execute WP-IMP-0016 strictly within bounded_files.
