schema_version: "WPS-1.0"
work_package_id: "WP-IMP-0026"
capability_id:
  id: "L4-FUS"
  version: "1.0"
title: "Implement Layer 4 decision synthesizer emitting CIO-05B"
status: "Completed"
is_immutable: true

governance:
  target_subsystem: "SLS-400"
  traceability:
    implements_req: ["FR-012"]
    trace_sls: "SLS-400"
    trace_adr: ["ADR-0001"]
    trace_vvc: "TVM-001"

preconditions:
  - predicate: "capability.complete('L3-WRM')"
  - predicate: "capability.complete('L3-SIM')"

resources:
  cpu: "low"
  memory: "512MB"
  network: false
  filesystem:
    write:
      - "06-runtime/afrp_runtime/layer4/synthesizer.py"
      - "tests/unit/test_layer4.py"
      - "05-work-packages/WP-IMP-0026/evidence/"
    read:
      - "06-runtime/afrp_runtime/contracts/"

execution:
  priority: "critical"
  estimated_complexity: "small"
  estimated_duration: "45m"
  parallelizable: false
  deterministic: true

rollback:
  strategy: "git_checkout_bounded_files"
  restore_tag: "HEAD"

inputs:
  required_files:
    - "06-runtime/afrp_runtime/contracts/cio.py"

outputs:
  expected_source_files:
    - "06-runtime/afrp_runtime/layer4/synthesizer.py"
    - "tests/unit/test_layer4.py"
  expected_evidence:
    - "05-work-packages/WP-IMP-0026/evidence/EXEC-024.yaml"

execution_results:
  source_files_modified:
    - "06-runtime/afrp_runtime/layer4/synthesizer.py"
    - "tests/unit/test_layer4.py"
  evidence_generated:
    - "05-work-packages/WP-IMP-0026/evidence/EXEC-024.yaml"

produces:
  capability:
    id: "L4-FUS"
    version: "1.0"
  unlocks:
    - id: "L4-DEC"
      version: "1.0"

scope:
  bounded_files:
    - "06-runtime/afrp_runtime/layer4/synthesizer.py"
    - "tests/unit/test_layer4.py"
  non_goals:
    - "No utility optimization or policy authorization."

requirements:
  synthesis:
    module: "06-runtime/afrp_runtime/layer4/synthesizer.py"
    rules:
      - "Join CIO-04, CIO-05A, and CIO-10 provenance into CIO-05B."
      - "Derive risk-aversion lambda and position cap from the mission profile."
      - "Reject mismatched instruments."

quality_gates:
  ruff_lint:
    required: true
    command: "uv run ruff check 06-runtime/ tests/"
  mypy_typecheck:
    required: true
    command: "uv run mypy --strict 06-runtime/ tests/unit/test_layer4.py"
  pytest_units:
    required: true
    command: "uv run pytest tests/unit/test_layer4.py -v"

completion:
  success_requires:
    - "CIO-05B carries an unbroken three-input provenance chain."
    - "Quality gates pass with zero errors."

failure_modes:
  ERR-CONTRACT-VIOLATION: "Upstream instruments do not match."

execution_prompt: |
  Execute WP-IMP-0026 strictly within bounded_files.
