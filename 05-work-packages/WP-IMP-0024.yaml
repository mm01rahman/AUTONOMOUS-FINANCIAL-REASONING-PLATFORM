schema_version: "WPS-1.0"
work_package_id: "WP-IMP-0024"
capability_id:
  id: "L3-WRM"
  version: "1.0"
title: "Implement DSmT PCR5 fusion core and World Model Kernel"
status: "Completed"
is_immutable: true

governance:
  target_subsystem: "SLS-300"
  traceability:
    implements_req: ["FR-011", "EDR-003"]
    trace_sls: "SLS-300"
    trace_adr: ["ADR-0001"]
    trace_vvc: "TVM-001"

preconditions:
  - predicate: "capability.complete('L2-MAC')"
  - predicate: "capability.complete('L2-MIC')"
  - predicate: "capability.complete('L2-LIQ')"
  - predicate: "capability.complete('L2-REG')"
  - predicate: "capability.complete('L2-FOR')"
  - predicate: "capability.complete('L2-BEH')"

resources:
  cpu: "medium"
  memory: "1GB"
  network: false
  filesystem:
    write:
      - "06-runtime/afrp_runtime/layer3/dsmt.py"
      - "06-runtime/afrp_runtime/layer3/worldmodel.py"
      - "tests/unit/test_layer3.py"
      - "05-work-packages/WP-IMP-0024/evidence/"
    read:
      - "06-runtime/afrp_runtime/contracts/"
      - "02-architecture/130_MATHEMATICAL_FOUNDATION.md"

execution:
  priority: "critical"
  estimated_complexity: "medium"
  estimated_duration: "2h"
  parallelizable: false
  deterministic: true

rollback:
  strategy: "git_checkout_bounded_files"
  restore_tag: "HEAD"

inputs:
  required_files:
    - "02-architecture/130_MATHEMATICAL_FOUNDATION.md"

outputs:
  expected_source_files:
    - "06-runtime/afrp_runtime/layer3/dsmt.py"
    - "06-runtime/afrp_runtime/layer3/worldmodel.py"
  expected_evidence:
    - "05-work-packages/WP-IMP-0024/evidence/EXEC-022.yaml"

execution_results:
  source_files_modified:
    - "06-runtime/afrp_runtime/layer3/dsmt.py"
    - "06-runtime/afrp_runtime/layer3/worldmodel.py"
    - "tests/unit/test_layer3.py"
  evidence_generated:
    - "05-work-packages/WP-IMP-0024/evidence/EXEC-022.yaml"

produces:
  capability:
    id: "L3-WRM"
    version: "1.0"
  unlocks:
    - id: "L3-SIM"
      version: "1.0"
    - id: "L4-FUS"
      version: "1.0"

scope:
  bounded_files:
    - "06-runtime/afrp_runtime/layer3/dsmt.py"
    - "06-runtime/afrp_runtime/layer3/worldmodel.py"
    - "tests/unit/test_layer3.py"
  non_goals:
    - "No decision optimization (Layer 4)."

requirements:
  implementation:
    module: "06-runtime/afrp_runtime/layer3/dsmt.py"
    rules:
      - "Canonical DNF element algebra over D^Theta; hybrid model M1 constrains RANGE x direction empty, allows BULL&BEAR paradox."
      - "Conjunctive consensus m12 and PCR5 redistribution exactly per MATH-001 section 2."
      - "Sequential fold for n sources (order = canonical agent order; non-associativity documented)."
      - "Shafer discounting for CIO-11 weights; generalized pignistic transform."
      - "WRM pads missing agents with vacuous BBAs (NFR-003); QuorumError only at zero healthy sources."

quality_gates:
  ruff_lint:
    required: true
    command: "uv run ruff check 06-runtime/ tests/"
  mypy_typecheck:
    required: true
    command: "uv run mypy --strict 06-runtime/ tests/unit/test_layer3.py"
  pytest_units:
    required: true
    command: "uv run pytest tests/unit/test_layer3.py -v"

completion:
  success_requires:
    - "Hand-worked numeric oracles reproduced exactly."
    - "Mass non-negativity and unit-sum preserved under all fixtures."

failure_modes:
  ERR-MATH-DIVERGENCE: "Fusion output violates BBA axioms."

execution_prompt: |
  Execute WP-IMP-0024 strictly within bounded_files. Article I applies: the
  mathematics of MATH-001 outranks any implementation convenience.
