schema_version: "WPS-1.0"
work_package_id: "WP-IMP-0013"
capability_id:
  id: "L1-ING"
  version: "1.0"
title: "Implement L1 telemetry ingress emitting CIO-01"
status: "Completed"
is_immutable: true

governance:
  target_subsystem: "SLS-100"
  traceability:
    implements_req: ["FR-009"]
    trace_sls: "SLS-100"
    trace_adr: ["ADR-0001"]
    trace_vvc: "TVM-001"

preconditions:
  - predicate: "capability.complete('RT-PROTO-CIO')"
  - predicate: "capability.complete('RT-COMMON')"

resources:
  cpu: "low"
  memory: "512MB"
  network: false
  filesystem:
    write:
      - "06-runtime/afrp_runtime/layer1/ingest.py"
      - "tests/unit/test_layer1.py"
      - "05-work-packages/WP-IMP-0013/evidence/"
    read:
      - "06-runtime/afrp_runtime/contracts/"

execution:
  priority: "high"
  estimated_complexity: "small"
  estimated_duration: "1h"
  parallelizable: false
  deterministic: true

rollback:
  strategy: "git_checkout_bounded_files"
  restore_tag: "HEAD"

inputs:
  required_files:
    - "06-runtime/afrp_runtime/contracts/cio.py"

outputs:
  expected_source_files:
    - "06-runtime/afrp_runtime/layer1/ingest.py"
  expected_evidence:
    - "05-work-packages/WP-IMP-0013/evidence/EXEC-011.yaml"

execution_results:
  source_files_modified:
    - "06-runtime/afrp_runtime/layer1/ingest.py"
    - "tests/unit/test_layer1.py"
  evidence_generated:
    - "05-work-packages/WP-IMP-0013/evidence/EXEC-011.yaml"

produces:
  capability:
    id: "L1-ING"
    version: "1.0"
  unlocks:
    - id: "L1-FST"
      version: "1.0"
    - id: "L1-RDB"
      version: "1.0"

scope:
  bounded_files:
    - "06-runtime/afrp_runtime/layer1/ingest.py"
    - "tests/unit/test_layer1.py"
  non_goals:
    - "No belief formation (Layer 2)."

requirements:
  implementation:
    module: "06-runtime/afrp_runtime/layer1/ingest.py"
    rules:
      - "Normalize venue events to CIO-01 with monotonic sequence."
      - "Reject crossed quotes, non-positive prices, unknown kinds."
      - "Count event-time regressions as gaps."

quality_gates:
  ruff_lint:
    required: true
    command: "uv run ruff check 06-runtime/ tests/"
  mypy_typecheck:
    required: true
    command: "uv run mypy --strict 06-runtime/ tests/unit/test_layer1.py"
  pytest_units:
    required: true
    command: "uv run pytest tests/unit/test_layer1.py -v"

completion:
  success_requires:
    - "Contract-only interconnect; gates pass with zero errors."

failure_modes:
  ERR-CONTRACT-VIOLATION: "Malformed telemetry or payload rejected."

execution_prompt: |
  Execute WP-IMP-0013 strictly within bounded_files.
