schema_version: "WPS-1.0"
work_package_id: "WP-RT-1001"
capability_id: {id: "L1-ING", version: "1.0"}
title: "Runtime backlog: Layer 1 market data collection engine"
layer: "Layer 1"
description: "Ingest market telemetry into CIO-01 with provider abstraction and canonical normalization."
objective: "Deliver deterministic, contract-compliant market data ingestion for tick and OHLCV inputs."
status: "Draft"
planning_status: "READY"
is_immutable: false
owner: "Runtime Planning Board"

governance:
  target_subsystem: "SLS-100"
  traceability:
    implements_req: ["FR-009"]
    trace_sls: "SLS-100"
    trace_adr: ["ADR-0001"]
    trace_vvc: "TVM-001"

preconditions:
  - {predicate: "capability.complete('RT-PROTO-CIO')"}
  - {predicate: "capability.complete('RT-COMMON')"}

resources:
  cpu: "medium"
  memory: "1GB"
  network: false
  filesystem:
    write:
      - "06-runtime/afrp_runtime/layer1/ingest.py"
      - "tests/unit/test_layer1_ingest.py"
      - "tests/integration/test_layer1_ingest_integration.py"
      - "docs/runtime/layer1-ingest.md"
      - "05-work-packages/WP-RT-1001/evidence/"
    read:
      - "06-runtime/afrp_runtime/contracts/"

execution:
  priority: "critical"
  estimated_complexity: "medium"
  estimated_duration: "2d"
  parallelizable: false
  deterministic: true

rollback: {strategy: "git_checkout_bounded_files", restore_tag: "HEAD"}
inputs:
  required_files:
    - "06-runtime/afrp_runtime/contracts/cio.py"
    - "02-architecture/110_RUNTIME_ARCHITECTURE.md"
outputs:
  expected_source_files:
    - "06-runtime/afrp_runtime/layer1/ingest.py"
    - "tests/unit/test_layer1_ingest.py"
    - "tests/integration/test_layer1_ingest_integration.py"
    - "docs/runtime/layer1-ingest.md"
  expected_evidence:
    - "05-work-packages/WP-RT-1001/evidence/EXEC-101.yaml"

produces:
  capability: {id: "L1-ING", version: "1.0"}
  unlocks:
    - {id: "L1-FST", version: "1.0"}
    - {id: "L1-RDB", version: "1.0"}

scope:
  bounded_files:
    - "06-runtime/afrp_runtime/layer1/ingest.py"
    - "tests/unit/test_layer1_ingest.py"
    - "tests/integration/test_layer1_ingest_integration.py"
    - "docs/runtime/layer1-ingest.md"
  non_goals:
    - "No feature engineering or feature-store logic."
    - "No replay, memory, or cross-layer orchestration."

requirements:
  acceptance_criteria:
    - "Market data ingestion supports both tick and OHLCV payloads."
    - "Provider interface and multi-provider abstraction are defined and exercised."
    - "Data and timestamp normalization produce canonical CIO-01 events."
    - "Error handling, health checks, and metrics are exposed for ingestion paths."
  required_tests:
    - "Unit: provider interface contract, normalization, validation, error paths."
    - "Integration: mixed-provider ingest pipeline emits deterministic CIO-01 sequences."
  evidence_requirements:
    - "ERS-1.0 record with quality gate outcomes and bounded-file compliance."
    - "Boundary audit PASS and traceability links to FR-009 and SLS-100."

quality_gates:
  ruff_lint: {required: true, command: "uv run ruff check 06-runtime/ tests/"}
  mypy_typecheck: {required: true, command: "uv run mypy --strict 06-runtime/ tests/"}
  pytest_units: {required: true, command: "uv run pytest tests/unit/test_layer1_ingest.py -v"}
  pytest_integration: {required: true, command: "uv run pytest tests/integration/test_layer1_ingest_integration.py -v"}
  coverage: {required: true, command: "uv run pytest tests --cov --cov-report=term"}
  fit_004: {required: true, command: "uv run afrp validate"}
  boundary_validation: {required: true, command: "uv run afrp evidence --wp WP-RT-1001"}

completion:
  success_requires:
    - "All acceptance criteria met with deterministic outputs under fixed seed conditions."
    - "All required quality gates pass with zero boundary violations."

failure_modes:
  ERR-PROVIDER-CONTRACT: "Provider adapter violates ingest interface."
  ERR-NORMALIZATION: "Input cannot be normalized into valid CIO-01."
  ERR-TIMESTAMP: "Timestamp normalization fails monotonicity/format constraints."

architecture_references:
  - "02-architecture/110_RUNTIME_ARCHITECTURE.md#1"
  - "02-architecture/200_REFERENCE_SPECIFICATION.md#2"
traceability_links: ["FR-009", "FIT-004", "FIT-005", "SLS-100"]
execution_prompt: |
  Execute WP-RT-1001 strictly within bounded_files and non_goals.
