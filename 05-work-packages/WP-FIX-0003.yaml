schema_version: "WPS-1.0"
work_package_id: "WP-FIX-0003"
capability_id:
  id: "PAPER-SHADOW-EXEC"
  version: "1.0"
title: "Reset Phase D decision-log artifacts per deterministic run"
status: "Completed"
is_immutable: false

governance:
  target_subsystem: "RESEARCH"
  traceability:
    implements_req: ["NFR-026", "NFR-028"]
    trace_sls: "AFRP-PHASE-D-1.0.0"
    trace_adr: ["ADR-0001"]
    trace_vvc: "TVM-001"

preconditions:
  - predicate: "capability.complete('PAPER-SHADOW-EXEC')"

resources:
  cpu: "low"
  memory: "512MB"
  network: false
  filesystem:
    write:
      - "tools/paper_trading/decision_log.py"
      - "tests/unit/test_paper_trading_modules.py"
      - "tests/integration/test_paper_trading_orchestrator.py"
      - "docs/research/PHASE_D_PAPER_TRADING.md"
      - "03-engineering/TRACEABILITY_MATRIX.yaml"
      - "CHANGELOG.md"
      - "05-work-packages/WP-FIX-0003.yaml"
      - "05-work-packages/WP-FIX-0003/evidence/EXEC-040.yaml"
      - "11-research/phase-d/"
    read:
      - "11-research/phase-d/decision_log.jsonl"
      - "11-research/phase-d/decision_log_digest.json"

execution:
  priority: "high"
  estimated_complexity: "small"
  estimated_duration: "2h"
  parallelizable: false
  deterministic: true

rollback:
  strategy: "git_checkout_bounded_files"
  restore_tag: "HEAD"

inputs:
  required_files:
    - "tools/paper_trading/decision_log.py"
    - "11-research/phase-d/decision_log.jsonl"
    - "11-research/phase-d/decision_log_digest.json"

outputs:
  expected_source_files:
    - "tools/paper_trading/decision_log.py"
    - "tests/unit/test_paper_trading_modules.py"
    - "tests/integration/test_paper_trading_orchestrator.py"
    - "docs/research/PHASE_D_PAPER_TRADING.md"
    - "03-engineering/TRACEABILITY_MATRIX.yaml"
    - "CHANGELOG.md"
    - "11-research/phase-d/"
  expected_evidence:
    - "05-work-packages/WP-FIX-0003/evidence/EXEC-040.yaml"

execution_results:
  source_files_modified:
    - "tools/paper_trading/decision_log.py"
    - "tests/unit/test_paper_trading_modules.py"
    - "tests/integration/test_paper_trading_orchestrator.py"
    - "docs/research/PHASE_D_PAPER_TRADING.md"
    - "03-engineering/TRACEABILITY_MATRIX.yaml"
    - "CHANGELOG.md"
    - "11-research/phase-d/"
  evidence_generated:
    - "05-work-packages/WP-FIX-0003/evidence/EXEC-040.yaml"

produces:
  capability:
    id: "PAPER-SHADOW-EXEC"
    version: "1.0"
  unlocks: []

scope:
  bounded_files:
    - "tools/paper_trading/decision_log.py"
    - "tests/unit/test_paper_trading_modules.py"
    - "tests/integration/test_paper_trading_orchestrator.py"
    - "docs/research/PHASE_D_PAPER_TRADING.md"
    - "03-engineering/TRACEABILITY_MATRIX.yaml"
    - "CHANGELOG.md"
    - "05-work-packages/WP-FIX-0003.yaml"
    - "05-work-packages/WP-FIX-0003/evidence/EXEC-040.yaml"
    - "11-research/phase-d/"
  non_goals:
    - "No runtime decision-policy redesign."
    - "No change to the required decision-log schema fields."
    - "No change to broker-free simulation-only constraints."

requirements:
  d5_001_traceability_integrity:
    classification: "Validation Defect"
    problem_statement: "Reusing the same Phase D output directory appended new JSONL records onto the previous decision log, while decision_log_digest.json still reported only the current run's record count and checksum. The published root artifact therefore contained 48 lines but a digest claiming 24 lines and a different SHA-256."
    affected_capabilities:
      - "PAPER-SHADOW-EXEC"
    evidence:
      - "11-research/phase-d/decision_log.jsonl"
      - "11-research/phase-d/decision_log_digest.json"
    proposed_correction:
      - "Reset the JSONL file at writer initialization so each deterministic campaign owns a fresh per-run artifact."
      - "Add tests proving reused output directories do not append stale records."
    acceptance_criteria:
      - "Running the orchestrator twice against the same output directory leaves the decision log with exactly iteration_count lines."
      - "The stored digest record count matches the file contents for the official Phase D artifact directory."
      - "The decision-log checksum remains deterministic across identical runs."

quality_gates:
  ruff_lint:
    required: true
    command: "uv run ruff check tools/paper_trading/decision_log.py tests/unit/test_paper_trading_modules.py tests/integration/test_paper_trading_orchestrator.py"
  mypy_typecheck:
    required: true
    command: "uv run mypy --strict tools/paper_trading/decision_log.py tests/unit/test_paper_trading_modules.py tests/integration/test_paper_trading_orchestrator.py"
  pytest_scoped:
    required: true
    command: "uv run pytest tests/unit/test_paper_trading_modules.py tests/integration/test_paper_trading_orchestrator.py -q"
  afrp_validate:
    required: true
    command: "uv run afrp validate"

completion:
  success_requires:
    - "Phase D decision-log and digest artifacts are truthful when campaigns are rerun in-place."
    - "Deterministic checksums remain stable across fresh runs."

failure_modes:
  ERR-LOG-APPEND: "Stale JSONL records remain in the official Phase D artifact directory after rerun."

execution_prompt: |
  Implement WP-FIX-0003 strictly within bounded_files and preserve the approved Phase D architecture and runtime contracts.
