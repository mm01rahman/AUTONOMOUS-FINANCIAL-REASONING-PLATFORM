schema_version: "WPS-1.0"
work_package_id: "WP-IMP-0023"
capability_id:
  id: "L2-BEH"
  version: "1.0"
title: "Implement behavioral belief agent"
status: "Completed"
is_immutable: true

governance:
  target_subsystem: "SLS-200"
  traceability:
    implements_req: ["FR-010"]
    trace_sls: "SLS-200"
    trace_adr: ["ADR-0001"]
    trace_vvc: "TVM-001"

preconditions:
  - predicate: "capability.complete('L2-BASE')"

resources:
  cpu: "low"
  memory: "512MB"
  network: false
  filesystem:
    write:
      - "06-runtime/afrp_runtime/layer2/agents.py"
      - "tests/unit/test_layer2.py"
      - "05-work-packages/WP-IMP-0023/evidence/"
    read:
      - "06-runtime/afrp_runtime/contracts/"
      - "06-runtime/afrp_runtime/layer1/features.py"

execution:
  priority: "high"
  estimated_complexity: "small"
  estimated_duration: "45m"
  parallelizable: true
  deterministic: true

rollback:
  strategy: "git_checkout_bounded_files"
  restore_tag: "HEAD"

inputs:
  required_files:
    - "06-runtime/afrp_runtime/contracts/cio.py"

outputs:
  expected_source_files:
    - "06-runtime/afrp_runtime/layer2/agents.py"
  expected_evidence:
    - "05-work-packages/WP-IMP-0023/evidence/EXEC-021.yaml"

execution_results:
  source_files_modified:
    - "06-runtime/afrp_runtime/layer2/agents.py"
    - "tests/unit/test_layer2.py"
  evidence_generated:
    - "05-work-packages/WP-IMP-0023/evidence/EXEC-021.yaml"

produces:
  capability:
    id: "L2-BEH"
    version: "1.0"
  unlocks:
    - id: "L3-WRM"
      version: "1.0"

scope:
  bounded_files:
    - "06-runtime/afrp_runtime/layer2/agents.py"
    - "tests/unit/test_layer2.py"
  non_goals:
    - "No fusion (Layer 3)."

requirements:
  implementation:
    module: "06-runtime/afrp_runtime/layer2/agents.py"
    rules:
      - "Contrarian positioning with paradoxical BULL&BEAR intersection mass."

quality_gates:
  ruff_lint:
    required: true
    command: "uv run ruff check 06-runtime/ tests/"
  mypy_typecheck:
    required: true
    command: "uv run mypy --strict 06-runtime/ tests/unit/test_layer2.py"
  pytest_units:
    required: true
    command: "uv run pytest tests/unit/test_layer2.py -v"

completion:
  success_requires:
    - "Valid BBA emission; NFR-003 degradation path proven."

failure_modes:
  ERR-CONTRACT-VIOLATION: "Invalid mass assignment rejected."

execution_prompt: |
  Execute WP-IMP-0023 strictly within bounded_files.
