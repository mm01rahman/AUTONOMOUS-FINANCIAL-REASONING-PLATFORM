[project]
name = "afrp-platform"
version = "0.1.0"
description = "Autonomous Financial Reasoning Platform"
requires-python = ">=3.11,<3.13"
dependencies = ["click>=8.1.0", "pydantic>=2.0.0", "pyyaml>=6.0.0"]

[project.scripts]
afrp = "afrp.cli:main"

[dependency-groups]
dev = [
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "jsonschema>=4.21.0",
    "types-pyyaml>=6.0.0",
    "types-jsonschema>=4.21.0",
    "types-protobuf>=4.25.0",
    "grpcio-tools>=1.62.0",
    "protobuf>=4.25.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "tools/afrp-cli/afrp",
    "06-runtime/afrp_runtime",
    "07-research/afrp_research",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "ANN"]

[tool.mypy]
strict = true
python_version = "3.11"
mypy_path = ["tools/afrp-cli", "06-runtime", "07-research"]
explicit_package_bases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["tools/afrp-cli/afrp"]
