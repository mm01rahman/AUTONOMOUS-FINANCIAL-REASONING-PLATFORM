schema_version: "1.0"
policy_id: "AFRP-SECURITY"
zero_trust:
  default_deny: true
  internal_transport: "grpc"
  tls:
    minimum_version: "1.3"
    mutual_authentication_required: true
  workload_identity:
    provider: "SPIFFE"
    trust_domain: "afrp.internal"
    socket_path: "/run/spire/sockets/agent.sock"
    certificate_ttl_seconds: 3600
  secret_sources:
    - "Vault"
    - "environment"
  hardcoded_secrets_allowed: false
  workload_ids:
    eos: "spiffe://afrp.internal/eos"
    runtime: "spiffe://afrp.internal/runtime"
    research: "spiffe://afrp.internal/research"
